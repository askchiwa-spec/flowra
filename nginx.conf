# ═══════════════════════════════════════════════════════
# nginx.conf — FlowrA Technology Africa Limited · flowratech.com
#
# SINGLE SOURCE OF TRUTH for the production nginx vhost.
# deploy.sh copies this file to /etc/nginx/sites-available/flowra.
# Do not hand-edit the copy on the server; edit here and redeploy.
#
# Requires (created by certbot on first run, see deploy.sh):
#   /etc/letsencrypt/live/flowratech.com/{fullchain,privkey}.pem
#   /etc/letsencrypt/options-ssl-nginx.conf
#   /etc/letsencrypt/ssl-dhparams.pem
# ═══════════════════════════════════════════════════════

# ── 1. Plain HTTP: ACME challenges, then redirect to canonical HTTPS ──
server {
    listen 80;
    listen [::]:80;
    server_name flowratech.com www.flowratech.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/flowra;
        default_type "text/plain";
    }

    location / {
        return 301 https://www.flowratech.com$request_uri;
    }
}

# ── 2. HTTPS apex → canonical www ─────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name flowratech.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/flowratech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flowratech.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://www.flowratech.com$request_uri;
}

# ── 3. HTTPS www: the site ────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.flowratech.com;
    server_tokens off;

    root  /var/www/flowra;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/flowratech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flowratech.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    # ── Compression ──────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types      text/plain text/css text/javascript application/javascript
                    application/json application/xml image/svg+xml
                    font/woff font/woff2;

    # ── Security headers ─────────────────────────────────
    # NOTE: nginx drops server-level add_header in any location that has
    # its own add_header. No location below uses add_header, so these
    # apply to every response, including 404s and redirects ("always").
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' https://js.hcaptcha.com https://*.hcaptcha.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.hcaptcha.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; connect-src 'self' https://api.web3forms.com https://*.hcaptcha.com; frame-src https://*.hcaptcha.com; form-action 'self' https://api.web3forms.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # ── Never serve repo/ops files from the webroot ──────
    location ~ /\. {
        return 404;
    }
    location ~* \.(sh|md|conf|zip|bak|log|yml|yaml|orig|swp)$ {
        return 404;
    }

    # ── HTML: always revalidate so deploys show up at once ──
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    # ── Versioned static assets (index.html uses ?v=…): cache 1 year ──
    location ~* \.(css|js|woff2|woff|ttf|otf)$ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|avif)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # ── Everything else: real 404s, no SPA fallback ──────
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    access_log /var/log/nginx/flowratech_access.log;
    error_log  /var/log/nginx/flowratech_error.log;
}
