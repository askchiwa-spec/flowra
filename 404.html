<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found — FlowrA Technology Africa</title>
  <link rel="icon" href="/images/Lion%20Roar%20Flowra.png" type="image/png">
  <style>
    :root { --navy:#0F2347; --gold:#C9A227; --bg:#F7F8FB; --text:#1A2740; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0B1730; --text:#E6ECF8; } }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text); font-family:'Montserrat',system-ui,-apple-system,sans-serif; padding:16px; text-align:center; }
    .mark { font-size:2rem; font-weight:900; color:var(--navy); letter-spacing:-.02em; }
    .mark span { color:var(--gold); }
    @media (prefers-color-scheme: dark) { .mark { color:#fff; } }
    .code { font-size:5rem; font-weight:800; line-height:1; margin:1.5rem 0 .5rem; color:var(--gold); }
    p { max-width:32rem; margin:0 auto 1.75rem; line-height:1.6; opacity:.85; }
    a.btn { display:inline-block; padding:.85rem 1.6rem; border-radius:999px; background:var(--navy); color:#fff; text-decoration:none; font-weight:700; }
  </style>
</head>
<body>
  <main>
    <div class="mark">Flowr<span>A</span></div>
    <div class="code">404</div>
    <p>That page doesn't exist. It may have moved, or the link may be wrong.</p>
    <a class="btn" href="/">Back to flowratech.com</a>
  </main>
</body>
</html>
